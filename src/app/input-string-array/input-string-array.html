<div class="d-flex flex-column align-items-center gap-3 p-3">
    <input 
        type="range" 
        list="available-days" 
        min="0" 
        max="{{ StringArray.length-1 }}" 
        step="1" 
        [value]="selectedDay"
        (input)="onSliderChange($event)"
        class="form-range">
        

    <datalist id="available-days">
        @for (day of StringArray; track day) {
            <option value="{{day}}"></option>
        }
    </datalist>
  <span class="badge text-bg-secondary">
    {{ hasSelectedDay ? StringArray[selectedDay] : 'Seleccione un día' }}
  </span>
</div>

<button class="btn btn-primary" [disabled]="!hasSelectedDay" (click)="reserveDay()">
  Reservar
</button>
